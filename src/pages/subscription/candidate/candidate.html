<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Candidato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Cadastrar Candidato</h1>
  <form id="candidate-form">
    <input type="text" placeholder="Nome" id="cand-name" required>
    <input type="email" placeholder="Email" id="cand-email" required>
    <input type="text" placeholder="CPF" id="cand-cpf" required>
    <input type="number" placeholder="Idade" id="cand-age" required>
    <input type="text" placeholder="Estado" id="cand-state" required>
    <input type="text" placeholder="CEP" id="cand-cep" required>
    <input type="text" placeholder="Resumo" id="cand-description" required>
    <input type="text" placeholder="Habilidades (separadas por vírgula)" id="cand-skills" required>
    <button type="submit">Adicionar</button>
  </form>
  <a href="../../../index.html">Voltar</a>

  <script type="module" src="subscription.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Empresa</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>Cadastrar Empresa</h1>
  <form id="company-form">
    <input type="text" placeholder="Nome" id="comp-name" required>
    <input type="email" placeholder="Email" id="comp-email" required>
    <input type="text" placeholder="CNPJ" id="comp-cnpj" required>
    <input type="text" placeholder="País" id="comp-country" required>
    <input type="text" placeholder="Estado" id="comp-state" required>
    <input type="text" placeholder="CEP" id="comp-cep" required>
    <input type="text" placeholder="Descrição" id="comp-description" required>
    <input type="text" placeholder="Tecnologias (separadas por vírgula)" id="comp-skills" required>
    <button type="submit">Adicionar</button>
  </form>
  <a href="../../../index.html">Voltar</a>

  <script type="module" src="Subscription.js"></script>
</body>
</html>
